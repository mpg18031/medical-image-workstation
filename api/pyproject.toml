[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mivw-api"
version = "0.1.0"
description = "MIVW REST/WebSocket gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "aioboto3>=13.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21",
    "zstandard>=0.23",
    "keyring>=25.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    "schemathesis>=3.38",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "sqlfluff>=3.2",
    "pydicom>=3.0",
    "onnx>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mivw_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "T20", "SIM", "RUF"]
# S608 (SQL injection) must never be suppressed: all SQL is parameterised.
ignore = ["N818", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA device",
    "integration: requires the docker compose stack",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
