name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '26'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: uv sync --directory api --extra dev
      - run: uv run --project api ruff check --ignore RUF100 api scripts
      - run: uv run --project api ruff format --check api scripts
      - run: uv run --directory api mypy --strict src
      - run: uv run --directory api bandit -r src -ll
      - run: uv run --directory api sqlfluff lint ../db --dialect postgres --exclude-rules LT01,LT02,LT05,CP02,RF04,CP04,LT14 --ignore parsing
      - run: npm ci --prefix desktop
      - run: npm run lint --prefix desktop

  database:
      name: Database (pgTAP)
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
            python-version: ${{ env.PYTHON_VERSION }}

        # 1️⃣ Install system packages first so Postgres can see the files
        - name: Install pgTAP system dependencies
          run: sudo apt-get update && sudo apt-get install -y postgresql-18-pgtap libtap-parser-sourcehandler-pgtap-perl || sudo apt-get install -y pgtap libtap-parser-sourcehandler-pgtap-perl

        # 2️⃣ Boot the cluster and activate the extensions
        - name: Start PostgreSQL Service
          run: |
            sudo systemctl start postgresql
            sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'ci';"
            sudo -u postgres psql -c "CREATE DATABASE mivw;"
            sudo -u postgres psql -d mivw -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

        - run: uv sync --directory api --extra dev
        - name: Apply migrations
          run: uv run --directory api python ../scripts/migrate.py apply
          env:
            MIVW_DB_DSN: postgresql://postgres:ci@localhost:5432/mivw
        - name: Run pgTAP suites
          run: pg_prove -d mivw -h localhost -U postgres --verbose db/tests/*.sql
          env:
            PGPASSWORD: ci

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install vulkan-headers vulkan-loader shaderc glslang dcmtk zstd libpng onnxruntime ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      # glslc package provides the glslc compiler executable
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools glslc \
            libdcmtk-dev libzstd-dev libpng-dev libonnxruntime-dev \
            libtiff-dev libjpeg-dev libssl-dev libxml2-dev zlib1g-dev \
            mesa-vulkan-drivers
      - uses: lukka/get-cmake@latest
        if: matrix.platform != 'windows'

      # Everything comes from MSYS2 UCRT64, including Vulkan and CMake, so the
      # compiler, C runtime and libraries all share one ABI. The LunarG SDK is
      # built for MSVC and is not used here.
      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-dcmtk
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-onnxruntime
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-glslang

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-ccache
        if: matrix.platform != 'windows'
      - run: cmake --preset cpu-only -DENABLE_OPT=OFF
        working-directory: core
      - run: cmake --build --preset cpu-only --parallel
        working-directory: core
      - name: Prepare and check test runtime (Windows)
        if: matrix.platform == 'windows'
        run: |
          set -euo pipefail
          exe=$(find build/cpu-only -name mivw_tests.exe | head -n 1)
          test -n "$exe"
          dir=$(dirname "$exe")
          # Prefer the same ONNX Runtime used at build time over System32's.
          cp -f /ucrt64/bin/onnxruntime.dll "$dir/"

          # MSYS2's ONNX Runtime 1.29.0-2 imports Abseil 2605, while its
          # current dependency can be 2608. Keep both ABIs available without
          # downgrading the packages used by the build.
          imports=$(objdump -p "$dir/onnxruntime.dll")
          if printf '%s\n' "$imports" | grep -i 'DLL Name: libabsl_.*-2605\.0\.0\.dll' > /dev/null &&
             [ ! -f /ucrt64/bin/libabsl_hash-2605.0.0.dll ]; then
            stage=$(mktemp -d)
            archive="$stage/abseil.pkg.tar.zst"
            curl -fsSL https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-abseil-cpp-20260526.0-1-any.pkg.tar.zst -o "$archive"
            echo "89803dbb88b7e1a18169fd2ecefa2b85de3d99fcd5d6899b737e4451532b691f  $archive" | sha256sum -c -
            tar -xf "$archive" -C "$stage"
            cp "$stage"/ucrt64/bin/libabsl_*-2605.0.0.dll "$dir/"
          fi

          # The MSYS2 shell supplies /ucrt64/bin for the remaining dependencies.
          # Fail here if the Windows loader cannot start the test executable.
          "$exe" --gtest_filter=Volume.RejectsSingularDirectionMatrix
        working-directory: core
      - run: ctest --preset cpu-only --output-on-failure
        working-directory: core

  core-sanitizers:
    name: Core (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: lukka/get-cmake@latest
      # glslc provides the shader compiler
      - name: Install Vulkan SDK & Utilities (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools glslc \
            libdcmtk-dev libzstd-dev libpng-dev libonnxruntime-dev \
            libtiff-dev libjpeg-dev libssl-dev libxml2-dev zlib1g-dev
      - run: cmake --preset asan -DENABLE_OPT=OFF
        working-directory: core
      - run: cmake --build --preset asan --parallel
        working-directory: core
      - run: ctest --preset asan
        working-directory: core
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    needs: [database]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mivw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIVW_MODE: local
      MIVW_DB_DSN: postgresql://postgres:ci@localhost:5432/mivw
      MIVW_OIDC_ISSUER: http://127.0.0.1:9317/realms/mivw
      MIVW_OIDC_AUDIENCE: ci
      MIVW_ENCRYPTION_KEY_ID: ci
      MIVW_HMAC_KEY_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --directory api --extra dev
      - run: uv run --directory api pytest -v --cov=mivw_api --cov-report=xml --cov-fail-under=84
      # openapi.json is git-ignored, so generate it here.
      - name: Export OpenAPI document
        run: uv run --directory api python ../scripts/export_openapi.py > openapi.json
      - name: Apply migrations
        run: uv run --directory api python ../scripts/migrate.py apply

      # A minimal OIDC provider (discovery + empty JWKS) so fuzzed bearer
      # tokens are rejected with 401 instead of the IdP-unreachable 503.
      - name: Start stub OIDC provider
        run: |
          d=$RUNNER_TEMP/oidc/realms/mivw
          mkdir -p "$d/.well-known" "$d/protocol/openid-connect"
          echo '{"issuer":"http://127.0.0.1:9317/realms/mivw","jwks_uri":"http://127.0.0.1:9317/realms/mivw/protocol/openid-connect/certs"}' > "$d/.well-known/openid-configuration"
          echo '{"keys":[]}' > "$d/protocol/openid-connect/certs"
          python3 -m http.server 9317 --bind 127.0.0.1 --directory "$RUNNER_TEMP/oidc" >/dev/null 2>&1 &
      - name: Start API
        run: |
          uv run --directory api uvicorn mivw_api.main:create_app --factory --port 8000 >"$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/openapi.json >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      # Skipped checks: negative_data_rejection (flags the correct 413 for
      # oversized bodies), allow_header_conformance (Starlette reports Allow
      # per route, and methods on one path span several routes) and
      # missing_required_header (the rate limiter can answer 429 before 401).
      - name: Contract fuzzing
        run: >-
          uv run --directory api schemathesis run ../openapi.json
          --url http://127.0.0.1:8000
          --checks all
          --exclude-checks negative_data_rejection,allow_header_conformance,missing_required_header
          --max-examples=100

  frontend:
    name: Frontend (Vitest + Storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run test:unit --prefix desktop
      - name: Cache Playwright Binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.NODE_VERSION }}
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: npm run build-storybook --prefix desktop
      - name: Component + accessibility tests
        run: |
          npx http-server storybook-static --port 6006 --silent &
          npx wait-on tcp:127.0.0.1:6006 --timeout 30000
          npm run test:component
        working-directory: desktop

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: uv sync --directory api --extra dev
      - run: uv run --directory api pip-audit
      - run: npm ci --prefix desktop
      - run: npm audit --audit-level=high --prefix desktop
      - name: Run OSV-Scanner (Direct CLI)
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o osv-scanner
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner -r ./ || true
