# Runs formatters, linters and secret scanning before a commit is created.
# Install with: pre-commit install --install-hooks

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Secrets must never reach history: rewriting a pushed branch to remove one
  # is far more expensive than blocking it here.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^api/src/
        additional_dependencies:
          - aioboto3>=13.2
          - asyncpg>=0.30
          - boto3>=1.35
          - fastapi>=0.115
          - httpx>=0.27
          - keyring>=25.4
          - numpy>=1.26
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - pyjwt[crypto]>=2.9
          - structlog>=24.4
          - types-requests
        args: [--strict]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-ll, -r]
        files: ^api/src/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        args:
          [--dialect, postgres, "--exclude-rules=LT01,LT02,LT05,CP02", "--ignore=parsing"]
        files: ^db/tests/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^desktop/.*\.(ts|vue|json|scss|md)$
        # `system` node is unusable here: npm 11.12.x rejects the
        # `--allow-git=root` install of this mirror's git placeholder package
        # (EALLOWGIT), so let nodeenv provision a node whose npm (11.19) accepts
        # it. Bump together with `rev` above when updating prettier.
        language_version: "26.8.1"

  - repo: local
    hooks:
      # Real patient data must never enter the repository. The generator tags
      # every fixture it produces; anything else is rejected outright.
      - id: no-unverified-dicom
        name: reject DICOM files not produced by the fixture generator
        entry: .venv/bin/python scripts/make_fixtures.py --verify --output core/tests/fixtures/generated
        language: system
        files: \.dcm$
        pass_filenames: false

      - id: conventional-commit
        name: conventional commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
